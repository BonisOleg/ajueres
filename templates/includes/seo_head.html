<link rel="canonical" href="{{ seo_canonical }}">
{% for item in seo_hreflang %}
<link rel="alternate" hreflang="{{ item.code }}" href="{{ item.url }}">
{% endfor %}
{% if seo_robots %}
<meta name="robots" content="{{ seo_robots }}">
{% endif %}
<meta property="og:type" content="website">
<meta property="og:title" content="{{ seo_title }}">
<meta property="og:description" content="{{ seo_description }}">
<meta property="og:url" content="{{ seo_canonical }}">
<meta property="og:image" content="{{ seo_og_image }}">
<meta property="og:image:width" content="{{ seo_og_image_width }}">
<meta property="og:image:height" content="{{ seo_og_image_height }}">
<meta property="og:locale" content="{{ seo_og_locale }}">
{% for locale in seo_og_locales_alt %}
<meta property="og:locale:alternate" content="{{ locale }}">
{% endfor %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo_title }}">
<meta name="twitter:description" content="{{ seo_description }}">
<meta name="twitter:image" content="{{ seo_og_image }}">
<script type="application/ld+json" nonce="{{ request.csp_nonce }}">{{ seo_json_ld|safe }}</script>
