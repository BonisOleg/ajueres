{% load i18n static ajeres_tags %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'ru' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF5A36">
  <title>{% block title %}AJERES{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}{% trans 'Дистрибьютор продуктов питания в Узбекистане' %}{% endblock %}">
  <link rel="icon" href="{% static 'favicon.ico' %}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/icons/favicon-32x32.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/icons/favicon-16x16.png' %}">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'img/icons/favicon-192x192.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/icons/apple-touch-icon.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/nav-mobile.css' %}">
  <link rel="stylesheet" href="{% static 'css/footer.css' %}">
  <link rel="stylesheet" href="{% static 'css/footer-2.css' %}">
  <link rel="stylesheet" href="{% static 'css/pages.css' %}">
  <link rel="stylesheet" href="{% static 'css/breadcrumbs.css' %}">
  <link rel="stylesheet" href="{% static 'css/contact-modal.css' %}">
  <style>:root { {{ theme_css_vars }} }</style>
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="page-shell" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% include "includes/header.html" %}
  <main class="site-main">
    {% block content %}{% endblock %}
  </main>
  {% include "includes/footer.html" %}
  {% include "includes/contact_modal.html" %}
  <script src="{% static 'js/main.js' %}" defer></script>
  <script src="{% static 'js/contact-form.js' %}" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
