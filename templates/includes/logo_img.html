{% load static %}
<img
  class="logo__img{% if extra_class %} {{ extra_class }}{% endif %}"
  src="{% static 'img/logo-ajeres.webp' %}"
  srcset="{% static 'img/logo-ajeres-196.webp' %} 196w, {% static 'img/logo-ajeres.webp' %} 392w"
  sizes="{{ sizes|default:'196px' }}"
  alt="AJERES"
  width="{{ width|default:196 }}"
  height="{{ height|default:48 }}"
  decoding="async"
>
