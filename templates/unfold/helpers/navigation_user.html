<div class="admin-user-menu border-t border-base-200 px-6 py-3 relative dark:border-base-800" x-data="{ openUserLinks: false }" x-on:click.outside="openUserLinks = false">
    <nav
        class="admin-user-menu__panel absolute bg-white border border-base-200 flex flex-col leading-none py-1 rounded-default shadow-lg bottom-[73px] left-3 right-3 z-50 dark:bg-base-800 dark:border-base-700"
        x-cloak
        x-show="openUserLinks"
        x-transition
        x-bind:aria-hidden="(!openUserLinks).toString()"
    >
        {% include "unfold/helpers/theme_switch.html" %}

        {% include "unfold/helpers/account_links.html" %}
    </nav>

    <button
        type="button"
        class="admin-user-menu__trigger cursor-pointer flex flex-row gap-3 items-center min-h-[64px] -mx-6 -my-3 px-6 py-3 hover:bg-base-100 dark:hover:bg-base-800"
        x-on:click="openUserLinks = !openUserLinks"
        x-bind:aria-expanded="openUserLinks.toString()"
        aria-haspopup="menu"
        aria-label="Меню аккаунта"
        x-bind:class="{'bg-base-100 dark:bg-base-800': openUserLinks}"
    >
        {% include "unfold/helpers/avatar.html" with user=request.user%}

        <div class="flex flex-col select-none min-w-0 text-left">
            <div class="font-semibold text-important tracking-tight truncate">
                {{ user.get_full_name|default:user.get_username }}
            </div>

            {% if user.email %}
                <div class="text-subtle text-xs truncate">
                    {{ user.email }}
                </div>
            {% endif %}
        </div>

        <span class="material-symbols-outlined ml-auto select-none text-font-default-light dark:text-font-default-dark">
            unfold_more
        </span>
    </button>
</div>
