{% load i18n unfold %}

<div class="border-b border-base-200 flex gap-3 items-center h-[65px] mb-4 dark:border-base-800 px-3 {% element_classes 'navigation_header' %}">
    <div class="bg-transparent flex font-semibold gap-3 grow min-w-0 h-[64px] items-center px-3 {% if site_dropdown %}cursor-pointer -mx-3 px-6 hover:bg-base-100 dark:hover:bg-white/[.06]{% endif %}"
         {% if site_dropdown %}
             x-on:click="siteDropdownOpen = !siteDropdownOpen"
             x-bind:class="{'bg-base-100 dark:bg-white/[.06]': siteDropdownOpen, 'bg-transparent': !siteDropdownOpen}"
         {% endif %}
    >
        <a href="{% url 'admin:index' %}" class="admin-brand-logo">
            <img src="{% firstof site_logo.light site_logo %}" alt="{% trans 'Home' %}" width="40" height="40">
        </a>

        {% if site_dropdown %}
            <span class="material-symbols-outlined ml-auto select-none text-font-default-light dark:text-font-default-dark">
                unfold_more
            </span>
        {% endif %}
    </div>

    <span class="material-symbols-outlined block cursor-pointer h-[18px] xl:hidden! hover:text-base-700 dark:hover:text-base-200" x-on:click="sidebarToggle()">
        close
    </span>

    {% include "unfold/helpers/site_dropdown.html" %}
</div>
