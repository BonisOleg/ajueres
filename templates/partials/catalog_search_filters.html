{% if oob %}
<div id="catalog-search-filters" hx-swap-oob="true">
{% endif %}
  <div id="catalog-search-filters-cats">
    {% for slug in active_categories %}
      <input type="hidden" name="category" value="{{ slug }}">
    {% endfor %}
  </div>
  {% for slug in active_features %}
    <input type="hidden" name="feature" value="{{ slug }}">
  {% endfor %}
{% if oob %}
</div>
{% endif %}
